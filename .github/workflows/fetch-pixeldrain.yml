name: fetch-pixeldrain

on:
  push:
    branches:
      - arena/01a0babf-peacock
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a0babf-peacock

      - name: Install innoextract
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y innoextract || sudo apt-get install -y innoextract=1.9*

      - name: Analyze installer (list contents, no execution)
        run: |
          set -x
          mkdir -p analysis
          F=fetched/HITMAN_3_Patch_3.280.0_V2.exe
          {
            echo "=== sha256 ==="; sha256sum "$F"
            echo "=== md5 ==="; md5sum "$F"
            echo "=== innoextract info ==="
            innoextract -i "$F" || true
            echo "=== innoextract file list ==="
            innoextract -l "$F" || true
            echo "=== innoextract languages ==="
            innoextract -m "$F" || true
          } > analysis/report.txt 2>&1 || true
          cat analysis/report.txt

      - name: Commit analysis back
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/report.txt
          git commit -m "chore: innoextract analysis of HITMAN 3 patch installer [skip ci]"
          git push origin arena/01a0babf-peacock
