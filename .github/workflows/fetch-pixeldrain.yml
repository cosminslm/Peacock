name: fetch-pixeldrain

on:
  push:
    branches:
      - arena/01a0babf-peacock
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a0babf-peacock

      - name: Download file from pixeldrain
        run: |
          set -x
          curl -L --fail --retry 3 -o "HITMAN_3_Patch_3.280.0_V2.exe" "https://pixeldrain.com/api/file/UQTKRLeX?download"
          ls -la
          file "HITMAN_3_Patch_3.280.0_V2.exe" || true
          sha256sum "HITMAN_3_Patch_3.280.0_V2.exe"
          md5sum "HITMAN_3_Patch_3.280.0_V2.exe"

      - name: Commit file to session branch
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p fetched
          mv "HITMAN_3_Patch_3.280.0_V2.exe" fetched/
          git add fetched/HITMAN_3_Patch_3.280.0_V2.exe
          git commit -m "chore: fetch HITMAN 3 Patch 3.280.0 V2.exe from pixeldrain [skip ci]"
          git push origin arena/01a0babf-peacock
