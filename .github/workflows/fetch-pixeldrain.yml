name: fetch-pixeldrain

on:
  push:
    branches:
      - arena/01a0babf-peacock
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a0babf-peacock

      - name: Install tools
        run: |
          set +e
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ libboost-iostreams-dev libboost-filesystem-dev \
            libboost-system-dev libboost-program-options-dev libboost-date-time-dev \
            liblzma-dev unzip nodejs
          exit 0

      - name: Build dscho innoextract (Inno 7 support)
        run: |
          set +e
          cd /tmp
          curl -sL -o dscho.tar.gz "https://codeload.github.com/dscho/innoextract/tar.gz/refs/heads/inno-6.4-to-6.7-support"
          rm -rf /tmp/dsrc && mkdir -p /tmp/dsrc
          tar xzf dscho.tar.gz -C /tmp/dsrc
          D=$(find /tmp/dsrc -maxdepth 1 -type d -name "innoextract-*" | head -1)
          mkdir -p "$D/build" && cd "$D/build"
          cmake .. -DCMAKE_BUILD_TYPE=Release > /tmp/cm.log 2>&1
          make -j4 > /tmp/mk.log 2>&1
          [ -f innoextract ] && cp innoextract /tmp/inno && echo "BUILT OK" || { echo BUILD FAILED; tail -5 /tmp/cm.log /tmp/mk.log; }
          exit 0

      - name: Extract installer
        run: |
          set +e
          F=fetched/HITMAN_3_Patch_3.280.0_V2.exe
          rm -rf /tmp/extracted && mkdir -p /tmp/extracted
          /tmp/inno -d /tmp/extracted "$F" > /dev/null 2>&1
          ls /tmp/extracted/app/Peacock/
          sha256sum /tmp/extracted/app/Peacock/chunk0.js
          exit 0

      - name: Match chunk0.js against recent official Peacock releases
        run: |
          set +e
          mkdir -p /tmp/rel
          BUNDLED=$(sha256sum /tmp/extracted/app/Peacock/chunk0.js | cut -d' ' -f1)
          BUNDLEDB=$(sha256sum /tmp/extracted/app/Peacock/webui/dist/assets/index-NtA75SgD.js | cut -d' ' -f1)
          {
            echo "bundled chunk0.js  : $BUNDLED"
            echo "bundled webui main : $BUNDLEDB"
            echo ""
            for TAG in $(curl -s "https://api.github.com/repos/thepeacockproject/Peacock/tags?per_page=15" | grep -oE '"name": "v[^"]+"' | cut -d'"' -f4); do
              ASSET="Peacock-${TAG}.zip"
              curl -sL -o rel.zip "https://github.com/thepeacockproject/Peacock/releases/download/${TAG}/${ASSET}"
              SZ=$(stat -c%s rel.zip 2>/dev/null)
              if [ "$SZ" -lt 1000000 ]; then echo "$TAG: download failed ($SZ bytes)"; continue; fi
              rm -rf /tmp/relx && mkdir -p /tmp/relx && cd /tmp/relx && unzip -o -q /tmp/rel.zip
              CH=$(find /tmp/relx -name chunk0.js -exec sha256sum {} \; | head -1 | cut -d' ' -f1)
              WI=$(find /tmp/relx -path "*webui/dist/assets/index-*.js" -exec sha256sum {} \; | head -1 | cut -d' ' -f1)
              MATCH=""; [ "$CH" = "$BUNDLED" ] && MATCH=" <== chunk0.js MATCH!"
              WM=""; [ "$WI" = "$BUNDLEDB" ] && WM=" <== webui MATCH!"
              echo "$TAG: chunk0=$CH webui=$WI$MATCH$WM"
              cd /tmp
            done
          } > "$GITHUB_WORKSPACE/analysis/extracted-info/release-match.txt" 2>&1
          cat "$GITHUB_WORKSPACE/analysis/extracted-info/release-match.txt"
          exit 0

      - name: If no exact match, diff bundled chunk0.js vs v8.9.1
        run: |
          set +e
          grep -q "MATCH" "$GITHUB_WORKSPACE/analysis/extracted-info/release-match.txt" && { echo "exact match found, skipping diff"; exit 0; }
          curl -sL -o /tmp/p891.zip "https://github.com/thepeacockproject/Peacock/releases/download/v8.9.1/Peacock-v8.9.1.zip"
          rm -rf /tmp/p891 && mkdir -p /tmp/p891 && cd /tmp/p891 && unzip -o -q /tmp/p891.zip
          OFF=$(find /tmp/p891 -name chunk0.js | head -1)
          sudo apt-get install -y nodejs >/dev/null 2>&1
          npx --yes js-beautify /tmp/extracted/app/Peacock/chunk0.js > /tmp/bundled.pretty.js 2>/dev/null
          npx --yes js-beautify "$OFF" > /tmp/official.pretty.js 2>/dev/null
          wc -l /tmp/bundled.pretty.js /tmp/official.pretty.js
          {
            echo "=== version strings bundled ==="
            grep -oE '"version": ?"[0-9.]+"|"PEACOCK_VERSION[^,]{0,40}|version: ?"[0-9.]+"' /tmp/bundled.pretty.js | head -5
            grep -m2 -oE 'v8\.[0-9]+\.[0-9]+|8\.[0-9]+\.[0-9]+' /tmp/bundled.pretty.js | head -5
            echo "=== version strings official v8.9.1 ==="
            grep -oE '"version": ?"[0-9.]+"|PEACOCK_VERSION[^,]{0,40}' /tmp/official.pretty.js | head -5
            echo "=== diffstat (beautified) ==="
            diff /tmp/bundled.pretty.js /tmp/official.pretty.js > /tmp/chunk.diff
            echo "lines added: $(grep -c '^>' /tmp/chunk.diff), removed: $(grep -c '^<' /tmp/chunk.diff)"
            echo "=== first 100 lines of diff ==="
            head -100 /tmp/chunk.diff
          } > "$GITHUB_WORKSPACE/analysis/extracted-info/chunk0-diff.txt" 2>&1
          cp /tmp/chunk.diff "$GITHUB_WORKSPACE/analysis/extracted-info/chunk0-full-diff.txt" 2>/dev/null
          cat "$GITHUB_WORKSPACE/analysis/extracted-info/chunk0-diff.txt"
          exit 0

      - name: Commit analysis back
        run: |
          set +e
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A analysis/
          git commit -m "chore: match chunk0.js against official Peacock releases [skip ci]"
          git pull --rebase origin arena/01a0babf-peacock || true
          git push origin arena/01a0babf-peacock || true
          exit 0
