name: fetch-pixeldrain

on:
  push:
    branches:
      - arena/01a0babf-peacock
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a0babf-peacock

      - name: Install tools
        run: |
          set +e
          mkdir -p analysis/buildlogs
          sudo apt-get update > analysis/buildlogs/apt.log 2>&1
          sudo apt-get install -y p7zip-full cmake g++ \
            libboost-iostreams-dev libboost-filesystem-dev libboost-system-dev \
            libboost-program-options-dev libboost-date-time-dev liblzma-dev >> analysis/buildlogs/apt.log 2>&1
          echo "apt exit: $?" >> analysis/buildlogs/apt.log
          which cmake g++ 7z >> analysis/buildlogs/apt.log 2>&1
          exit 0

      - name: Build innoextract variants
        run: |
          set +e
          cd /tmp
          for REF in "master:master" "pr214:refs/pull/214/head" "pr212:refs/pull/212/head"; do
            NAME="${REF%%:*}"; REFSPEC="${REF#*:}"
            LOG="$GITHUB_WORKSPACE/analysis/buildlogs/build-$NAME.log"
            {
              echo "=== building $NAME ($REFSPEC) ==="
              curl -sL -o src.tar.gz "https://codeload.github.com/dscharrer/innoextract/tar.gz/$REFSPEC"
              echo "curl exit: $? size: $(stat -c%s src.tar.gz 2>/dev/null)"
              [ -s src.tar.gz ] || { echo "download failed for $NAME"; continue; }
              rm -rf /tmp/isrc && mkdir -p /tmp/isrc
              tar xzf src.tar.gz -C /tmp/isrc
              echo "tar exit: $?"
              D=$(find /tmp/isrc -maxdepth 1 -type d -name "innoextract-*" | head -1)
              echo "src dir: $D"
              [ -n "$D" ] || continue
              mkdir -p "$D/build"
              cd "$D/build"
              cmake .. -DCMAKE_BUILD_TYPE=Release 2>&1 | tail -25
              echo "cmake exit: ${PIPESTATUS[0]}"
              make -j4 2>&1 | tail -25
              echo "make exit: ${PIPESTATUS[0]}"
              ls -la innoextract 2>/dev/null || echo "binary missing"
              cd /tmp
            } > "$LOG" 2>&1
            [ -f "$D/build/innoextract" ] && cp "$D/build/innoextract" /tmp/innoextract-$NAME
          done
          ls -la /tmp/innoextract-* 2>/dev/null || echo "NO BINARIES BUILT"
          exit 0

      - name: Run innoextract variants on the file
        run: |
          set +e
          F=fetched/HITMAN_3_Patch_3.280.0_V2.exe
          for BIN in /tmp/innoextract-*; do
            [ -x "$BIN" ] || continue
            N=$(basename "$BIN")
            "$BIN" -i "$F" > "analysis/inno-info-$N.txt" 2>&1
            "$BIN" -l "$F" > "analysis/inno-list-$N.txt" 2>&1
            "$BIN" -s -d /tmp/extracted-$N "$F" > "analysis/inno-extract-$N.log" 2>&1
          done
          exit 0

      - name: Commit analysis back
        run: |
          set +e
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A analysis/
          git commit -m "chore: innoextract build logs + extraction attempt [skip ci]"
          git pull --rebase origin arena/01a0babf-peacock || true
          git push origin arena/01a0babf-peacock || true
          exit 0
