name: fetch-pixeldrain

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: arena/01a0babf-peacock

      - name: Install tools
        run: |
          set +e
          sudo apt-get update -qq
          sudo apt-get install -y cmake g++ libboost-iostreams-dev libboost-filesystem-dev \
            libboost-system-dev libboost-program-options-dev libboost-date-time-dev \
            liblzma-dev unzip
          exit 0

      - name: Build dscho innoextract (Inno 7 support)
        run: |
          set +e
          cd /tmp
          curl -sL -o dscho.tar.gz "https://codeload.github.com/dscho/innoextract/tar.gz/refs/heads/inno-6.4-to-6.7-support"
          rm -rf /tmp/dsrc && mkdir -p /tmp/dsrc
          tar xzf dscho.tar.gz -C /tmp/dsrc
          D=$(find /tmp/dsrc -maxdepth 1 -type d -name "innoextract-*" | head -1)
          mkdir -p "$D/build" && cd "$D/build"
          cmake .. -DCMAKE_BUILD_TYPE=Release > /tmp/cm.log 2>&1
          make -j4 > /tmp/mk.log 2>&1
          [ -f innoextract ] && cp innoextract /tmp/inno
          exit 0

      - name: Extract installer
        run: |
          set +e
          F=fetched/HITMAN_3_Patch_3.280.0_V2.exe
          rm -rf /tmp/extracted && mkdir -p /tmp/extracted
          /tmp/inno -d /tmp/extracted "$F" > /dev/null 2>&1
          ls -la /tmp/extracted/app/Retail/
          exit 0

      - name: Decompile Launcher.exe and embedded PeacockPatcher.Core.dll
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/analysis/decompiled"
          # extract costura-compressed embedded assemblies with python
          python3 - <<'EOF'
          import struct, zlib, re, os
          data = open('/tmp/extracted/app/Retail/Launcher.exe','rb').read()
          # .NET resources: find compressed costura blobs heuristically:
          # costura stores each as a .NET embedded resource, zlib raw-deflate.
          # Search for resource names in UTF-16 (metadata strings)
          names = re.findall(rb'(?:c\x00o\x00s\x00t\x00u\x00r\x00a\x00\.[^\x00]{1,80}?\x00)', data)
          print("resource name strings found:", len(names))
          for n in names:
              print("  ", n.decode('utf-16-le', errors='replace'))
          # try raw deflate scan around manifest resources is complex; instead use dotnet to list resources
          EOF
          # use dotnet (preinstalled) to enumerate and extract resources
          cat > /tmp/dumpres.csx <<'EOF'
          EOF
          dotnet --list-sdks
          dotnet tool install -g ilspycmd 2>&1 | tail -1
          export PATH="$PATH:/home/runner/.dotnet/tools"
          mkdir -p /tmp/decom
          ilspycmd -p -o /tmp/decom/launcher /tmp/extracted/app/Retail/Launcher.exe > /tmp/ilsy.log 2>&1
          echo "ilspy exit: $?"
          ls /tmp/decom/launcher 2>/dev/null
          # extract costura embedded dlls: use mono? simpler: python with pefile-less approach via System.Reflection is not available;
          # try: ilspycmd can list resources
          ilspycmd -l r /tmp/extracted/app/Retail/Launcher.exe 2>/dev/null | head -30
          exit 0

      - name: Extract costura blobs and decompile
        run: |
          set +e
          export PATH="$PATH:/home/runner/.dotnet/tools"
          # write a tiny C# program to dump embedded resources
          mkdir -p /tmp/dumper && cd /tmp/dumper
          dotnet new console -o . --force > /dev/null 2>&1
          cat > Program.cs <<'EOF'
          using System;
          using System.IO;
          using System.Reflection;

          class P {
            static void Main(string[] args) {
              var asm = Assembly.LoadFile(args[0]);
              foreach (var rn in asm.GetManifestResourceNames()) {
                Console.WriteLine("RESOURCE: " + rn);
                using var s = asm.GetManifestResourceStream(rn);
                using var ms = new MemoryStream();
                s.CopyTo(ms);
                File.WriteAllBytes("/tmp/res_" + rn.Replace('/', '_'), ms.ToArray());
              }
            }
          }
          EOF
          dotnet run -- /tmp/extracted/app/Retail/Launcher.exe > /tmp/dump.log 2>&1
          cat /tmp/dump.log
          ls -la /tmp/res_* 2>/dev/null
          # costura .compressed = raw deflate
          python3 - <<'EOF'
          import zlib, glob
          for p in glob.glob('/tmp/res_*.compressed'):
              raw = open(p,'rb').read()
              try:
                  out = zlib.decompress(raw, -15)
                  dst = p.replace('.compressed','')
                  open(dst,'wb').write(out)
                  print("decompressed", dst, len(out))
              except Exception as e:
                  print("fail", p, e)
          EOF
          ls -la /tmp/res_*.dll 2>/dev/null
          for DLL in /tmp/res_*.dll; do
            [ -f "$DLL" ] || continue
            B=$(basename "$DLL")
            ilspycmd -p -o "/tmp/decom/$B" "$DLL" > /dev/null 2>&1
            echo "decompiled $B"
          done
          # copy all decompiled sources to workspace
          cp -r /tmp/decom/* "$GITHUB_WORKSPACE/analysis/decompiled/" 2>/dev/null
          find "$GITHUB_WORKSPACE/analysis/decompiled" -type f | head -20
          # show the interesting code
          echo "================ PeacockPatcher.Core decompiled ================"
          find /tmp/decom -name "*.cs" | xargs grep -l "Peacock" 2>/dev/null | head -5
          exit 0

      - name: Commit decompiled analysis
        run: |
          set +e
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A analysis/
          git commit -m "chore: decompile Launcher.exe + embedded PeacockPatcher.Core [skip ci]"
          git pull --rebase origin arena/01a0babf-peacock || true
          git push origin arena/01a0babf-peacock || true
          exit 0
